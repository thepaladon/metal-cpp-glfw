<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>metal-cpp-glfw WebGPU</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --text: #e5e7eb;
      --muted: #94a3b8;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 10% 20%, #111827 0%, #0b1220 45%, #060b13 100%);
      color: var(--text);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }

    #status {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 2;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: rgba(15, 23, 34, 0.85);
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="status">Initializing WebGPU…</div>

  <script>
    const canvasElement = document.getElementById("canvas");
    const statusElement = document.getElementById("status");

    canvasElement.addEventListener("pointerdown", () => {
      canvasElement.focus({ preventScroll: true });
    });
    canvasElement.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    async function loadWasmApp() {
      if (!("gpu" in navigator)) {
        statusElement.textContent = "WebGPU unavailable in this browser.";
        return;
      }

      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
          statusElement.textContent = "WebGPU adapter request returned null.";
          return;
        }

        const device = await adapter.requestDevice();
        globalThis.Module = {
          preinitializedWebGPUDevice: device,
          onRuntimeInitialized: () => {
            statusElement.textContent = "WebGPU running. Open ImGui window for controls.";
            setTimeout(() => {
              statusElement.style.opacity = "0.0";
              statusElement.style.transition = "opacity 0.4s ease";
            }, 2000);
          },
          onAbort: (reason) => {
            statusElement.style.opacity = "1.0";
            statusElement.textContent = `Runtime aborted: ${reason}`;
          }
        };

        const script = document.createElement("script");
        script.src = "app.js";
        script.async = true;
        document.body.appendChild(script);
      } catch (error) {
        statusElement.textContent = `WebGPU init failed: ${error}`;
      }
    }

    loadWasmApp();
  </script>
</body>
</html>
